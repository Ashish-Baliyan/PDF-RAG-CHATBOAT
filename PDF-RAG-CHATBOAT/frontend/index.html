<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF RAG Chatboat</title>
    <style>
      body {
        margin: 0;
        background: #eef2f3;
        color: #152322;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-screen {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .boot-card {
        width: min(420px, 100%);
        padding: 22px;
        border: 1px solid #d6dedc;
        border-radius: 8px;
        background: #fffdfa;
        box-shadow: 0 18px 50px rgba(31, 46, 43, 0.14);
      }

      .boot-card h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .boot-card p {
        margin: 0;
        color: #63706d;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card">
          <h1>PDF RAG Chatboat</h1>
          <p>Loading the chat UI...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
